###############################################
# Configuración de la aplicación SumixKids     #
# Archivo: src/main/resources/config.properties
###############################################

# --- Base de datos ---
# Primero se intentará usar la configuración puesta en el servidor (JNDI).
# Si no existe, se usan estos datos de respaldo.

db.url=jdbc:mysql://localhost:3306/sumixkids?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=

# Driver JDBC (para conectar con MySQL 8)
db.driver=com.mysql.cj.jdbc.Driver

# Nombre del DataSource JNDI en Tomcat
jndi.name=jdbc/sumixkidsDS

# Tamaños orientativos de un pool simple (si se llegara a usar internamente).
db.pool.minIdle=2
db.pool.maxPoolSize=10

# --- Seguridad / Autenticación ---
# Fuerza del cifrado de contraseñas (número de repeticiones). 10 está bien para pruebas.
security.bcrypt.rounds=10

# --- Aplicación ---
app.encoding=UTF-8
app.locale=es_PE

# (Por ahora no se usa envío de correos, se dejará para más adelante.)
